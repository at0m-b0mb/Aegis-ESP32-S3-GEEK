name: host-tests

# The detection engines are pure C with no ESP-IDF dependency, so CI compiles
# and runs the whole detector test-suite on a plain Ubuntu box in seconds.
on:
  push:
  pull_request:

jobs:
  engine-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run detector unit tests
        run: make -C test/host
